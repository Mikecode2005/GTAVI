name: Quality

on:
  push:
  pull_request:

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install
      - run: node --check public/main.js
      - run: bun run build
